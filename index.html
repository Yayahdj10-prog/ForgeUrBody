<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>ForgeUrBody</title>
<style>
:root{--bg:#0a1424;--surface:#12203a;--surface2:#1a2b4a;--surface3:#223755;--border:#1e3050;--border2:#2e4570;--text:#e8eef7;--muted:#7a8ba5;--muted2:#5a6b85;--red:#e63946;--red-hover:#ff4757;--blue:#3a7bd5;--green:#2ecc71;--yellow:#f39c12;--radius:14px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font:15px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden;padding-bottom:calc(70px + env(safe-area-inset-bottom))}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:15px;color:var(--text);background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:12px 14px;width:100%;outline:none;transition:border-color .2s}
input:focus,select:focus,textarea:focus{border-color:var(--red)}
textarea{resize:vertical;min-height:80px}
header{position:sticky;top:0;z-index:50;background:rgba(10,20,36,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:calc(12px + env(safe-area-inset-top)) 16px 12px;display:flex;align-items:center;gap:12px}
.logo{font-weight:900;font-size:20px;letter-spacing:-.5px;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.logo-mark{width:32px;height:32px;background:var(--red);border-radius:8px;display:grid;place-items:center;font-size:18px;font-weight:900;color:#fff;box-shadow:0 4px 20px rgba(230,57,70,.4)}
.logo span{color:var(--red)}
.streak{margin-left:auto;font-size:12px;color:var(--muted);background:var(--surface);padding:6px 10px;border-radius:20px;border:1px solid var(--border);display:flex;align-items:center;gap:4px}
nav{position:fixed;bottom:0;left:0;right:0;z-index:50;background:rgba(10,20,36,.96);backdrop-filter:blur(12px);border-top:1px solid var(--border);display:flex;justify-content:space-around;padding:8px 4px calc(8px + env(safe-area-inset-bottom))}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border-radius:10px;font-size:10px;font-weight:600;color:var(--muted);transition:all .2s;letter-spacing:.3px;text-transform:uppercase}
.nav-btn .ico{font-size:20px;line-height:1}
.nav-btn.active{color:var(--red)}
.nav-btn.active .ico{transform:scale(1.1)}
main{padding:16px;max-width:680px;margin:0 auto}
.section{display:none;animation:fadein .3s ease}
.section.active{display:block}
@keyframes fadein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
h1{font-size:22px;font-weight:900;text-transform:uppercase;letter-spacing:-.5px;margin-bottom:4px}
h2{font-size:16px;font-weight:800;text-transform:uppercase;letter-spacing:.3px;margin:20px 0 12px;color:var(--text);display:flex;align-items:center;gap:8px}
h2::before{content:'';width:4px;height:16px;background:var(--red);border-radius:2px}
h3{font-size:14px;font-weight:700;margin-bottom:6px}
p.lead{color:var(--muted);font-size:13px;margin-bottom:16px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px}
.card-hero{background:linear-gradient(135deg,var(--surface2) 0%,var(--surface) 100%);border:1px solid var(--border2);border-radius:var(--radius);padding:18px;margin-bottom:16px;position:relative;overflow:hidden}
.card-hero::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--red),transparent)}
.btn{background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:12px 18px;font-weight:700;font-size:14px;color:var(--text);transition:all .15s;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{border-color:var(--red);color:#fff}
.btn-primary{background:var(--red);border-color:var(--red);color:#fff;box-shadow:0 4px 16px rgba(230,57,70,.3)}
.btn-primary:hover{background:var(--red-hover);border-color:var(--red-hover);color:#fff}
.btn-block{display:flex;width:100%;justify-content:center}
.btn-sm{padding:8px 12px;font-size:12px;border-radius:8px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
@media(max-width:480px){.form-row{grid-template-columns:1fr}}
.form-group{margin-bottom:12px}
.form-group label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:6px}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.grid-2{grid-template-columns:1fr 1fr}
@media(max-width:480px){.grid{grid-template-columns:1fr}}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;cursor:pointer;transition:all .2s}
.tile:hover{border-color:var(--red);transform:translateY(-2px)}
.stat-big{font-size:32px;font-weight:900;letter-spacing:-1px;line-height:1.1}
.stat-label{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700}
.stat-card{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:14px;text-align:center}
.bar{height:8px;background:var(--surface3);border-radius:99px;overflow:hidden;margin:6px 0}
.bar-fill{height:100%;background:linear-gradient(90deg,var(--red),#ff6b6b);border-radius:99px;transition:width .4s}
.pills{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pill{flex-shrink:0;padding:8px 14px;background:var(--surface2);border:1px solid var(--border);border-radius:99px;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;cursor:pointer;transition:all .15s;white-space:nowrap}
.pill.active{background:var(--red);color:#fff;border-color:var(--red)}
.list-item{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:8px;display:flex;align-items:center;gap:12px}
.list-item-content{flex:1;min-width:0}
.list-item-title{font-weight:700;font-size:14px}
.list-item-sub{font-size:12px;color:var(--muted);margin-top:2px}
.list-item-actions{display:flex;gap:6px;flex-shrink:0}
.badge{display:inline-block;padding:3px 8px;border-radius:6px;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.5px}
.badge-red{background:rgba(230,57,70,.15);color:var(--red)}
.badge-blue{background:rgba(58,123,213,.15);color:var(--blue)}
.badge-green{background:rgba(46,204,113,.15);color:var(--green)}
.badge-yellow{background:rgba(243,156,18,.15);color:var(--yellow)}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(4px)}
.modal-overlay.open{display:flex}
.modal{background:var(--surface);border:1px solid var(--border2);border-radius:20px 20px 0 0;width:100%;max-width:680px;max-height:85vh;overflow-y:auto;padding:20px;padding-bottom:calc(20px + env(safe-area-inset-bottom));animation:slideup .25s ease}
@keyframes slideup{from{transform:translateY(100%)}to{transform:none}}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.modal-title{font-size:18px;font-weight:900;text-transform:uppercase;letter-spacing:-.3px}
.modal-close{width:32px;height:32px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-size:18px;color:var(--muted)}
.toast{position:fixed;bottom:calc(80px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) translateY(100px);background:var(--red);color:#fff;padding:12px 20px;border-radius:99px;font-weight:700;font-size:13px;z-index:200;transition:transform .3s ease;box-shadow:0 8px 24px rgba(230,57,70,.4);max-width:calc(100% - 32px);text-align:center}
.toast.show{transform:translateX(-50%) translateY(0)}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty .ico{font-size:48px;margin-bottom:12px;opacity:.5}
.empty-title{font-weight:700;margin-bottom:6px;color:var(--text)}
.empty-text{font-size:13px}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.tag{font-size:10px;padding:3px 7px;background:var(--surface3);border-radius:6px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.3px}
.instruction{background:var(--surface2);border-radius:10px;padding:12px;margin:8px 0;font-size:13px;line-height:1.6;border-left:3px solid var(--red)}
.instruction strong{color:var(--red)}
.data-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:14px}
.data-row:last-child{border-bottom:none}
.data-row .label{color:var(--muted)}
.data-row .value{font-weight:700}
.macro-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0}
.macro-box{background:var(--surface2);border-radius:8px;padding:8px 4px;text-align:center;border:1px solid var(--border)}
.macro-val{font-size:15px;font-weight:900;color:var(--text)}
.macro-lbl{font-size:9px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700}
@media(min-width:768px){body{padding-bottom:0}nav{position:sticky;top:60px;bottom:auto;border-top:none;border-bottom:1px solid var(--border);padding:0 16px;max-width:680px;margin:0 auto;border-left:1px solid var(--border);border-right:1px solid var(--border);border-radius:0 0 12px 12px}.nav-btn{flex-direction:row;gap:8px;padding:14px 8px;font-size:12px}.nav-btn .ico{font-size:16px}}
</style>
</head>
<body>

<header>
  <div class="logo"><div class="logo-mark">F</div>Forge<span>Ur</span>Body</div>
  <div class="streak" id="streakDisplay">🔥 0j</div>
</header>

<nav>
  <button class="nav-btn active" data-tab="dashboard"><span class="ico">🏠</span>Accueil</button>
  <button class="nav-btn" data-tab="muscu"><span class="ico">🏋️</span>Muscu</button>
  <button class="nav-btn" data-tab="nutrition"><span class="ico">🍎</span>Nutrition</button>

<main>

  <section id="tab-muscu" class="section"><h1>Musculation</h1><p class="lead">Programmes, exercices et journal de séances</p><div class="pills" id="muscuPills"><button class="pill active" data-mt="library">Bibliothèque</button><button class="pill" data-mt="program">Programme</button><button class="pill" data-mt="session">Séance du jour</button><button class="pill" data-mt="history">Historique</button></div><div id="muscuContent"></div></section>
  <section id="tab-nutrition" class="section"><h1>Nutrition</h1><p class="lead">Calories, macros, repas et recettes</p><div class="pills" id="nutriPills"><button class="pill active" data-nt="log">Journal du jour</button><button class="pill" data-nt="calc">Calculateur</button><button class="pill" data-nt="recipes">Recettes</button></div><div id="nutritionContent"></div></section>
  <section id="tab-sommeil" class="section"><h1>Sommeil & Récupération</h1><p class="lead">Cycles de sommeil, suivi et étirements</p><div class="pills" id="sommeilPills"><button class="pill active" data-st="calc">Calculateur</button><button class="pill" data-st="log">Journal</button><button class="pill" data-st="stretch">Étirements</button></div><div id="sommeilContent"></div></section>

</main>

<div class="modal-overlay" id="modalOverlay"><div class="modal"><div class="modal-header"><div class="modal-title" id="modalTitle">Titre</div><button class="modal-close" onclick="closeModal()">✕</button></div><div id="modalBody"></div></div></div>
<div class="toast" id="toast"></div>

<script>

{id:'row-barbell',name:'Rowing barre',muscle:'Dos',equip:'Barre',loc:'salle',instr:'Buste penché à 45°, dos droit. Tirer la barre vers le nombril, coudes vers l\'arrière.',tips:'Serre les omoplates à la fin du mouvement.'},

{id:'leg-curl',name:'Leg curl',muscle:'Jambes',equip:'Machine',loc:'salle',instr:'Allongé, fléchir les genoux pour ramener les talons vers les fesses.',tips:'Cible l\'arrière des cuisses.'},

function round(n,dp=0){return Math.round(n*Math.pow(10,dp))/Math.pow(10,dp)}
function $id(id){return document.getElementById(id)}
function $(sel){return document.querySelector(sel)}
function $$(sel){return document.querySelectorAll(sel)}
function showToast(msg){const t=$id('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2200)}
function openModal(title,html){$id('modalTitle').textContent=title;$id('modalBody').innerHTML=html;$id('modalOverlay').classList.add('open')}
function closeModal(){$id('modalOverlay').classList.remove('open')}

/* ===== STATE ===== */
const state={
profile:Store.get('profile',{weight:70,height:175,age:25,sex:'m',activity:1.375,goal:'recomp'}),
foodLog:Store.get('foodLog',{}),
sessions:Store.get('sessions',[]),
sleepLog:Store.get('sleepLog',{}),
runs:Store.get('runs',[]),
streak:Store.get('streak',0),
lastActive:Store.get('lastActive',null)
};
function saveProfile(){Store.set('profile',state.profile)}
function saveFoodLog(){Store.set('foodLog',state.foodLog)}
function saveSessions(){Store.set('sessions',state.sessions)}
function saveSleepLog(){Store.set('sleepLog',state.sleepLog)}
function saveRuns(){Store.set('runs',state.runs)}
function updateStreak(){const t=today();if(state.lastActive!==t){const yesterday=new Date(Date.now()-86400000).toISOString().slice(0,10);if(state.lastActive===yesterday)state.streak++;else state.streak=1;state.lastActive=t;Store.set('streak',state.streak);Store.set('lastActive',t)}}

/* ===== CALCULATORS ===== */
function calcBMR(){const p=state.profile;if(p.sex==='m')return 10*p.weight+6.25*p.height-5*p.age+5;return 10*p.weight+6.25*p.height-5*p.age-161}
function calcTDEE(){return calcBMR()*state.profile.activity}
function calcIMC(){return state.profile.weight/Math.pow(state.profile.height/100,2)}
function imcLabel(v){if(v<18.5)return{t:'Insuffisance',c:'yellow'};if(v<25)return{t:'Normal',c:'green'};if(v<30)return{t:'Surpoids',c:'yellow'};return{t:'Obésité',c:'red'}}
function calcMacros(){const tdee=calcTDEE();const goal=state.profile.goal;let kcal=tdee;if(goal==='cut')kcal=tdee-400;else if(goal==='bulk')kcal=tdee+300;const proteinPerKg=goal==='cut'?2.2:goal==='bulk'?1.8:2.0;const protein=state.profile.weight*proteinPerKg;const fat=kcal*0.28/9;const carbs=(kcal-protein*4-fat*9)/4;return{kcal:Math.round(kcal),protein:Math.round(protein),carbs:Math.round(carbs),fat:Math.round(fat)}}
function calcSleepCycles(wakeOrBed,isWakeTime){const cycles=[3,4,5,6,7];const results=[];cycles.forEach(n=>{const mins=n*90+15;let date=new Date();const[h,m]=wakeOrBed.split(':').map(Number);if(isWakeTime){date.setHours(h,m,0,0);date.setMinutes(date.getMinutes()-mins);results.push({cycles:n,time:date.toTimeString().slice(0,5),sleep:(n*1.5).toFixed(1)})}else{date.setHours(h,m,0,0);date.setMinutes(date.getMinutes()+mins);results.push({cycles:n,time:date.toTimeString().slice(0,5),sleep:(n*1.5).toFixed(1)})}});return results}

/* ===== RENDER DASHBOARD ===== */
function renderDashboard(){updateStreak();$id('streakDisplay').textContent='🔥 '+state.streak+'j';$id('todayDate').textContent=fmtDate(today());const macros=calcMacros();const todayFood=state.foodLog[today()]||[];const eaten=todayFood.reduce((a,m)=>({kcal:a.kcal+m.kcal,p:a.p+m.p,c:a.c+m.c,f:a.f+m.f}),{kcal:0,p:0,c:0,f:0});const remaining={kcal:Math.max(0,macros.kcal-eaten.kcal),p:Math.max(0,macros.protein-eaten.p),c:Math.max(0,macros.carbs-eaten.c),f:Math.max(0,macros.fat-eaten.f)};const sleepLast=state.sleepLog[today()];const lastSession=state.sessions[0];const lastRun=state.runs[0];const imc=calcIMC();const imcInfo=imcLabel(imc);let html='';html+=`<div class="card-hero"><div class="stat-label">Calories aujourd'hui</div><div style="display:flex;align-items:baseline;gap:6px;margin:6px 0"><div class="stat-big" style="color:var(--red)">${remaining.kcal}</div><div style="color:var(--muted);font-size:13px">/ ${macros.kcal} kcal restantes</div></div><div class="bar"><div class="bar-fill" style="width:${Math.min(100,eaten.kcal/macros.kcal*100)}%"></div></div><div style="display:flex;gap:8px;margin-top:10px;font-size:12px"><div>🥩 <b>${Math.round(eaten.p)}</b>/${macros.protein}g</div><div>🍞 <b>${Math.round(eaten.c)}</b>/${macros.carbs}g</div><div>🥑 <b>${Math.round(eaten.f)}</b>/${macros.fat}g</div></div></div>`;html+='<div class="grid grid-2">';html+=`<div class="stat-card"><div class="stat-label">IMC</div><div class="stat-big" style="font-size:24px">${round(imc,1)}</div><div class="badge badge-${imcInfo.c}" style="margin-top:4px">${imcInfo.t}</div></div>`;html+=`<div class="stat-card"><div class="stat-label">Sommeil</div><div class="stat-big" style="font-size:24px">${sleepLast?sleepLast.hours.toFixed(1)+'h':'—'}</div><div style="font-size:11px;color:var(--muted);margin-top:4px">${sleepLast?'cette nuit':'non enregistré'}</div></div>`;html+='</div>';html+='<h2>Activité récente</h2>';if(lastSession){html+=`<div class="list-item"><div style="font-size:24px">🏋️</div><div class="list-item-content"><div class="list-item-title">${lastSession.name}</div><div class="list-item-sub">${lastSession.exercises.length} exercices · ${lastSession.date}</div></div></div>`}if(lastRun){html+=`<div class="list-item"><div style="font-size:24px">🏃</div><div class="list-item-content"><div class="list-item-title">Course ${lastRun.distance} km</div><div class="list-item-sub">${lastRun.duration} min · ${lastRun.pace} · ${lastRun.date}</div></div></div>`}if(!lastSession&&!lastRun){html+='<div class="empty"><div class="ico">🎯</div><div class="empty-title">Commence ton parcours</div><div class="empty-text">Enregistre ta première séance ou course</div></div>'}html+='<h2>Actions rapides</h2>';html+=`<div class="grid"><button class="btn" onclick="switchTab('nutrition');setNutriTab('log')">➕ Ajouter un repas</button><button class="btn" onclick="switchTab('muscu');setMuscuTab('session')">🏋️ Nouvelle séance</button><button class="btn" onclick="switchTab('course');setCourseTab('gps')">📍 Lancer une course</button><button class="btn" onclick="switchTab('sommeil');setSommeilTab('calc')">💤 Calculer mon sommeil</button></div>`;$id('dashboardContent').innerHTML=html}

/* ===== RENDER MUSCU ===== */
let muscuTab='library';
function setMuscuTab(t){muscuTab=t;$$('#muscuPills .pill').forEach(p=>p.classList.toggle('active',p.dataset.mt===t));renderMuscu()}
function renderMuscu(){const el=$id('muscuContent');if(muscuTab==='library')renderExerciseLibrary(el);else if(muscuTab==='program')renderProgramGenerator(el);else if(muscuTab==='session')renderSessionLogger(el);else if(muscuTab==='history')renderSessionHistory(el)}
function renderExerciseLibrary(el){const muscles=['Tous','Pectoraux','Dos','Épaules','Biceps','Triceps','Jambes','Fessiers','Abdos','Full body'];const locs=['Tous','salle','maison'];const muscle=window._muscleFilter||'Tous';const loc=window._locFilter||'Tous';let filtered=EXERCISES;if(muscle!=='Tous')filtered=filtered.filter(e=>e.muscle===muscle);if(loc!=='Tous')filtered=filtered.filter(e=>e.loc===loc);let html='';html+='<div class="form-group"><label>Muscle</label><select onchange="window._muscleFilter=this.value;renderMuscu()">'+muscles.map(m=>`<option ${m===muscle?'selected':''}>${m}</option>`).join('')+'</select></div>';html+='<div class="form-group"><label>Lieu</label><select onchange="window._locFilter=this.value;renderMuscu()">'+locs.map(l=>`<option value="${l}" ${l===loc?'selected':''}>${l==='Tous'?'Tous':l==='salle'?'Salle de sport':'Maison'}</option>`).join('')+'</select></div>';html+=`<p style="color:var(--muted);font-size:12px;margin:8px 0">${filtered.length} exercice(s)</p>`;filtered.forEach(ex=>{html+=`<div class="list-item" onclick="showExercise('${ex.id}')" style="cursor:pointer"><div class="list-item-content"><div class="list-item-title">${ex.name}</div><div class="list-item-sub">${ex.muscle} · ${ex.equip} · ${ex.loc==='salle'?'Salle':'Maison'}</div></div><div style="font-size:18px;color:var(--red)">›</div></div>`});el.innerHTML=html}
function showExercise(id){const ex=EXERCISES.find(e=>e.id===id);if(!ex)return;const html=`<div class="tags"><span class="tag">${ex.muscle}</span><span class="tag">${ex.equip}</span><span class="tag">${ex.loc==='salle'?'Salle':'Maison'}</span></div><div class="instruction" style="margin-top:16px"><strong>Comment faire :</strong><br>${ex.instr}</div><div class="instruction"><strong>💡 Conseil :</strong><br>${ex.tips}</div><button class="btn btn-primary btn-block" onclick="closeModal()" style="margin-top:16px">Compris</button>`;openModal(ex.name,html)}
function renderProgramGenerator(el){el.innerHTML=`<div class="card"><h3>Génère ton programme</h3><p style="color:var(--muted);font-size:13px;margin-bottom:12px">Un programme adapté à ton niveau sur la semaine.</p><div class="form-group"><label>Niveau</label><select id="progLevel"><option value="debutant_3j">Débutant (3 jours)</option><option value="inter_4j">Intermédiaire (4 jours)</option><option value="avance_5j">Avancé (5 jours)</option></select></div><button class="btn btn-primary btn-block" onclick="generateProgram()">⚡ Générer</button></div><div id="programResult"></div>`}
function generateProgram(){const level=$id('progLevel').value;const tmpl=PROGRAM_TEMPLATES[level];if(!tmpl)return;let html='';tmpl.days.forEach((day,i)=>{html+=`<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><h3 style="margin:0">${day.name}</h3><span class="badge badge-red">Jour ${i+1}</span></div>`;day.exercises.forEach(exId=>{const ex=EXERCISES.find(e=>e.id===exId);if(ex){html+=`<div style="padding:8px 0;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px"><div style="flex:1;font-size:13px">${ex.name}</div><span class="tag">${ex.equip}</span></div>`}});html+=`<button class="btn btn-sm" style="margin-top:10px" onclick="startSession('${day.name}','${day.exercises.join(',')}')">🚀 Démarrer cette séance</button>`;html+='</div>'});$id('programResult').innerHTML=html}
function startSession(name,exerciseIds){closeModal();const ids=exerciseIds.split(',');const todaySession={id:Date.now(),date:today(),name:name,exercises:ids.map(id=>{const ex=EXERCISES.find(e=>e.id===id);return{id,name:ex?ex.name:id,sets:[]}})};window._activeSession=todaySession;setMuscuTab('session')}
function renderSessionLogger(el){const sess=window._activeSession;if(!sess){el.innerHTML=`<div class="empty"><div class="ico">🏋️</div><div class="empty-title">Aucune séance en cours</div><div class="empty-text">Génère un programme ou démarre une séance libre</div><button class="btn btn-primary" style="margin-top:16px" onclick="startFreeSession()">Séance libre</button></div>`;return}let html=`<div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><div><div class="stat-label">Séance en cours</div><h3 style="margin:2px 0 0 0">${sess.name}</h3></div><span class="badge badge-red">${sess.exercises.length} ex.</span></div></div>`;sess.exercises.forEach((ex,exIdx)=>{html+=`<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><h3 style="margin:0;font-size:15px">${ex.name}</h3><button class="btn btn-sm" onclick="addSet(${exIdx})">+ Série</button></div>`;if(ex.sets.length===0){html+='<p style="color:var(--muted);font-size:12px">Aucune série. Clique sur "+ Série" pour commencer.</p>'}else{ex.sets.forEach((s,i)=>{html+=`<div class="list-item" style="padding:8px 10px"><div class="list-item-content"><div style="font-size:13px"><b>Série ${i+1}</b> · ${s.reps} reps @ ${s.weight} kg</div></div><button class="btn btn-sm" onclick="delSet(${exIdx},${i})">✕</button></div>`})}html+='</div>'});html+=`<button class="btn btn-primary btn-block" onclick="finishSession()" style="margin-bottom:8px">✓ Terminer la séance</button><button class="btn btn-block" onclick="cancelSession()">Annuler</button>`;el.innerHTML=html}
function startFreeSession(){const name=prompt('Nom de la séance (ex: Push):','Séance libre');if(!name)return;window._activeSession={id:Date.now(),date:today(),name,exercises:[]};renderMuscu()}
function addSet(exIdx){const sess=window._activeSession;if(!sess)return;const ex=sess.exercises[exIdx];const reps=prompt('Combien de répétitions ?','10');if(!reps)return;const weight=prompt('Quel poids (kg) ?','0');if(weight===null)return;ex.sets.push({reps:parseInt(reps),weight:parseFloat(weight)});renderMuscu()}
function delSet(exIdx,setIdx){const sess=window._activeSession;if(!sess)return;sess.exercises[exIdx].sets.splice(setIdx,1);renderMuscu()}
function finishSession(){const sess=window._activeSession;if(!sess)return;state.sessions.unshift(sess);saveSessions();window._activeSession=null;showToast('Séance enregistrée ✓');renderDashboard();setMuscuTab('history')}
function cancelSession(){if(!confirm('Annuler cette séance ?'))return;window._activeSession=null;renderMuscu()}
function renderSessionHistory(el){if(state.sessions.length===0){el.innerHTML='<div class="empty"><div class="ico">📋</div><div class="empty-title">Aucune séance enregistrée</div><div class="empty-text">Tes séances apparaîtront ici</div></div>';return}let html='';state.sessions.slice(0,20).forEach(s=>{const totalSets=s.exercises.reduce((a,e)=>a+e.sets.length,0);const totalVolume=s.exercises.reduce((a,e)=>a+e.sets.reduce((b,st)=>b+st.reps*st.weight,0),0);html+=`<div class="list-item"><div class="list-item-content"><div class="list-item-title">${s.name}</div><div class="list-item-sub">${s.date} · ${s.exercises.length} ex · ${totalSets} séries · ${round(totalVolume)} kg</div></div></div>`});el.innerHTML=html}

/* ===== RENDER NUTRITION ===== */
let nutriTab='log';
function setNutriTab(t){nutriTab=t;$$('#nutriPills .pill').forEach(p=>p.classList.toggle('active',p.dataset.nt===t));renderNutrition()}
function renderNutrition(){const el=$id('nutritionContent');if(nutriTab==='log')renderFoodLog(el);else if(nutriTab==='calc')renderNutriCalc(el);else if(nutriTab==='recipes')renderRecipes(el)}
function renderFoodLog(el){const macros=calcMacros();const todayFood=state.foodLog[today()]||[];const eaten=todayFood.reduce((a,m)=>({kcal:a.kcal+m.kcal,p:a.p+m.p,c:a.c+m.c,f:a.f+m.f}),{kcal:0,p:0,c:0,f:0});const remaining={kcal:Math.max(0,macros.kcal-eaten.kcal),p:Math.max(0,macros.protein-eaten.p),c:Math.max(0,macros.carbs-eaten.c),f:Math.max(0,macros.fat-eaten.f)};let html=`<div class="card-hero"><div class="stat-label">Restant aujourd'hui</div><div class="stat-big" style="color:var(--red);margin:4px 0">${remaining.kcal} kcal</div><div class="macro-grid"><div class="macro-box"><div class="macro-val">${Math.round(eaten.p)}/${macros.protein}</div><div class="macro-lbl">🥩 Prot.</div></div><div class="macro-box"><div class="macro-val">${Math.round(eaten.c)}/${macros.carbs}</div><div class="macro-lbl">🍞 Gluc.</div></div><div class="macro-box"><div class="macro-val">${Math.round(eaten.f)}/${macros.fat}</div><div class="macro-lbl">🥑 Lip.</div></div><div class="macro-box"><div class="macro-val">${Math.round(eaten.kcal)}</div><div class="macro-lbl">Total</div></div></div></div>`;html+=`<button class="btn btn-primary btn-block" onclick="addMeal()" style="margin-bottom:16px">➕ Ajouter un repas</button>`;html+='<h2>Repas d\'aujourd\'hui</h2>';if(todayFood.length===0){html+='<div class="empty"><div class="ico">🍽️</div><div class="empty-title">Aucun repas</div><div class="empty-text">Ajoute ton premier repas</div></div>'}else{todayFood.forEach((m,i)=>{html+=`<div class="list-item"><div class="list-item-content"><div class="list-item-title">${m.name}</div><div class="list-item-sub">${Math.round(m.kcal)} kcal · P${Math.round(m.p)} · G${Math.round(m.c)} · L${Math.round(m.f)}</div></div><button class="btn btn-sm" onclick="delMeal(${i})">✕</button></div>`})}el.innerHTML=html}
function addMeal(){const html=`<p style="color:var(--muted);font-size:13px;margin-bottom:12px">Choisis une recette ou saisis manuellement.</p><button class="btn btn-primary btn-block" onclick="closeModal();setNutriTab('recipes')" style="margin-bottom:8px">📖 Choisir dans les recettes</button><button class="btn btn-block" onclick="manualMeal()">✍️ Saisie manuelle</button>`;openModal('Ajouter un repas',html)}
function manualMeal(){closeModal();const name=prompt('Nom du repas:','Repas');if(!name)return;const kcal=parseInt(prompt('Calories (kcal):','500'));if(!kcal)return;const p=parseFloat(prompt('Protéines (g):','30'));const c=parseFloat(prompt('Glucides (g):','50'));const f=parseFloat(prompt('Lipides (g):','15'));const t=today();if(!state.foodLog[t])state.foodLog[t]=[];state.foodLog[t].push({name,kcal,p:p||0,c:c||0,f:f||0});saveFoodLog();showToast('Repas ajouté ✓');renderNutrition();renderDashboard()}
function delMeal(i){const t=today();state.foodLog[t].splice(i,1);saveFoodLog();renderNutrition();renderDashboard()}
function addRecipeToLog(recipeId){const r=RECIPES.find(x=>x.id===recipeId);if(!r)return;const t=today();if(!state.foodLog[t])state.foodLog[t]=[];state.foodLog[t].push({name:r.name,kcal:r.kcal,p:r.p,c:r.c,f:r.f});saveFoodLog();showToast('Repas ajouté ✓');closeModal();renderNutrition();renderDashboard()}
function renderNutriCalc(el){const macros=calcMacros();const imc=calcIMC();const imcInfo=imcLabel(imc);el.innerHTML=`<div class="card"><h3>Ton profil</h3><div class="form-row"><div class="form-group"><label>Poids (kg)</label><input type="number" id="pWeight" value="${state.profile.weight}" step="0.5"></div><div class="form-group"><label>Taille (cm)</label><input type="number" id="pHeight" value="${state.profile.height}"></div></div><div class="form-row"><div class="form-group"><label>Âge</label><input type="number" id="pAge" value="${state.profile.age}"></div><div class="form-group"><label>Sexe</label><select id="pSex"><option value="m" ${state.profile.sex==='m'?'selected':''}>Homme</option><option value="f" ${state.profile.sex==='f'?'selected':''}>Femme</option></select></div></div><div class="form-group"><label>Activité</label><select id="pActivity"><option value="1.2" ${state.profile.activity==1.2?'selected':''}>Sédentaire</option><option value="1.375" ${state.profile.activity==1.375?'selected':''}>Légère</option><option value="1.55" ${state.profile.activity==1.55?'selected':''}>Modérée</option><option value="1.725" ${state.profile.activity==1.725?'selected':''}>Intense</option></select></div><div class="form-group"><label>Objectif</label><select id="pGoal"><option value="cut" ${state.profile.goal==='cut'?'selected':''}>Perte de poids</option><option value="recomp" ${state.profile.goal==='recomp'?'selected':''}>Recomposition</option><option value="bulk" ${state.profile.goal==='bulk'?'selected':''}>Prise de masse</option></select></div><button class="btn btn-primary btn-block" onclick="saveProfileAndCalc()">Calculer</button></div><div class="card-hero"><div class="stat-label">IMC</div><div class="stat-big">${round(imc,1)}</div><div class="badge badge-${imcInfo.c}" style="margin-top:6px">${imcInfo.t}</div></div><div class="card"><h3>Objectifs quotidiens</h3><div class="data-row"><span class="label">Calories</span><span class="value">${macros.kcal} kcal</span></div><div class="data-row"><span class="label">Protéines</span><span class="value">${macros.protein} g</span></div><div class="data-row"><span class="label">Glucides</span><span class="value">${macros.carbs} g</span></div><div class="data-row"><span class="label">Lipides</span><span class="value">${macros.fat} g</span></div></div>`}
function saveProfileAndCalc(){state.profile={weight:parseFloat($id('pWeight').value),height:parseFloat($id('pHeight').value),age:parseInt($id('pAge').value),sex:$id('pSex').value,activity:parseFloat($id('pActivity').value),goal:$id('pGoal').value};saveProfile();renderNutriCalc($id('nutritionContent'));renderDashboard();showToast('Profil mis à jour ✓')}
function renderRecipes(el){const types=['Toutes','Petit-déj','Déjeuner','Dîner','Collation'];const budgets=['Tous','faible','moyen'];const type=window._recipeType||'Toutes';const budget=window._recipeBudget||'Tous';let filtered=RECIPES;if(type!=='Toutes')filtered=filtered.filter(r=>r.type===type);if(budget!=='Tous')filtered=filtered.filter(r=>r.budget===budget);let html=`<div class="form-row"><div class="form-group"><label>Type</label><select onchange="window._recipeType=this.value;renderNutrition()">${types.map(t=>`<option ${t===type?'selected':''}>${t}</option>`).join('')}</select></div><div class="form-group"><label>Budget</label><select onchange="window._recipeBudget=this.value;renderNutrition()">${budgets.map(b=>`<option value="${b}" ${b===budget?'selected':''}>${b==='Tous'?'Tous':b==='faible'?'Petit budget':'Moyen'}</option>`).join('')}</select></div></div>`;html+=`<p style="color:var(--muted);font-size:12px;margin:8px 0">${filtered.length} recette(s)</p>`;filtered.forEach(r=>{html+=`<div class="list-item" onclick="showRecipe(${r.id})" style="cursor:pointer"><div class="list-item-content"><div class="list-item-title">${r.name}</div><div class="list-item-sub">${r.kcal} kcal · ${r.min} min · ${r.budget==='faible'?'💰':'💰💰'} · ${r.type}</div></div><div style="font-size:18px;color:var(--red)">›</div></div>`});el.innerHTML=html}
function showRecipe(id){const r=RECIPES.find(x=>x.id===id);if(!r)return;const html=`<div class="tags"><span class="tag">${r.type}</span><span class="tag">${r.min} min</span><span class="tag">${r.budget==='faible'?'💰 Petit budget':'💰💰 Budget moyen'}</span></div><div class="macro-grid" style="margin-top:14px"><div class="macro-box"><div class="macro-val">${r.kcal}</div><div class="macro-lbl">kcal</div></div><div class="macro-box"><div class="macro-val">${r.p}g</div><div class="macro-lbl">Prot.</div></div><div class="macro-box"><div class="macro-val">${r.c}g</div><div class="macro-lbl">Gluc.</div></div><div class="macro-box"><div class="macro-val">${r.f}g</div><div class="macro-lbl">Lip.</div></div></div><h3 style="margin-top:16px">Ingrédients</h3><ul style="margin:8px 0;padding-left:20px;font-size:14px">${r.ing.map(i=>`<li>${i}</li>`).join('')}</ul><h3>Préparation</h3><div class="instruction" style="margin-top:8px">${r.steps}</div><button class="btn btn-primary btn-block" onclick="addRecipeToLog(${r.id})" style="margin-top:16px">✓ Ajouter au journal</button>`;openModal(r.name,html)}

/* ===== RENDER SOMMEIL ===== */
let sommeilTab='calc';
function setSommeilTab(t){sommeilTab=t;$$('#sommeilPills .pill').forEach(p=>p.classList.toggle('active',p.dataset.st===t));renderSommeil()}
function renderSommeil(){const el=$id('sommeilContent');if(sommeilTab==='calc')renderSleepCalc(el);else if(sommeilTab==='log')renderSleepLog(el);else if(sommeilTab==='stretch')renderStretches(el)}
function renderSleepCalc(el){el.innerHTML=`<div class="card"><h3>Calculateur de sommeil</h3><p style="color:var(--muted);font-size:13px;margin-bottom:12px">Basé sur des cycles de 90 min.</p><div class="form-group"><label>Je veux...</label><select id="sleepMode" onchange="updateSleepCalc()"><option value="wake">Me réveiller à</option><option value="bed">Me coucher à</option></select></div><div class="form-group"><label>Heure</label><input type="time" id="sleepTime" value="07:00" onchange="updateSleepCalc()"></div></div><div id="sleepResult"></div>`;updateSleepCalc()}
function updateSleepCalc(){const mode=$id('sleepMode').value;const time=$id('sleepTime').value;if(!time)return;const results=calcSleepCycles(time,mode==='wake');let html=`<h2>${mode==='wake'?'Couche-toi à':'Lève-toi à'}</h2>`;results.forEach(r=>{html+=`<div class="list-item"><div class="list-item-content"><div class="list-item-title" style="font-size:20px;color:var(--red)">${r.time}</div><div class="list-item-sub">${r.cycles} cycles · ${r.sleep}h de sommeil</div></div></div>`});html+='<p style="color:var(--muted);font-size:12px;margin-top:12px">💡 5-6 cycles = idéal (7h30-9h). 4 cycles = minimum (6h).</p>';$id('sleepResult').innerHTML=html}
function renderSleepLog(el){let html=`<button class="btn btn-primary btn-block" onclick="logSleep()" style="margin-bottom:16px">➕ Enregistrer ma nuit</button>`;const entries=Object.entries(state.sleepLog).sort().reverse();if(entries.length===0){html+='<div class="empty"><div class="ico">💤</div><div class="empty-title">Aucun sommeil enregistré</div></div>'}else{entries.slice(0,14).forEach(([date,s])=>{html+=`<div class="list-item"><div class="list-item-content"><div class="list-item-title">${s.hours.toFixed(1)} h de sommeil</div><div class="list-item-sub">${s.bedtime} → ${s.wakeTime} · ${fmtDate(date)}</div></div></div>`})}el.innerHTML=html}
function logSleep(){const bed=prompt('Heure de coucher (HH:MM):','23:00');if(!bed)return;const wake=prompt('Heure de réveil (HH:MM):','07:00');if(!wake)return;const[bh,bm]=bed.split(':').map(Number);const[wh,wm]=wake.split(':').map(Number);let bedMins=bh*60+bm;let wakeMins=wh*60+wm;if(wakeMins<=bedMins)wakeMins+=24*60;const hours=(wakeMins-bedMins)/60;state.sleepLog[today()]={bedtime:bed,wakeTime:wake,hours};saveSleepLog();showToast('Sommeil enregistré ✓');renderSommeil();renderDashboard()}
function renderStretches(el){let html='<p style="color:var(--muted);font-size:13px;margin-bottom:12px">Routine d\'étirements — 10 min.</p>';STRETCHES.forEach(s=>{html+=`<div class="card"><div style="display:flex;justify-content:space-between;margin-bottom:6px"><h3 style="margin:0;font-size:14px">${s.name}</h3><span class="badge badge-blue">${s.dur}</span></div><p style="font-size:13px;color:var(--muted);margin:0">${s.desc}</p></div>`});el.innerHTML=html}

/* ===== RENDER COURSE ===== */
let courseTab='plans';
function setCourseTab(t){courseTab=t;$$('#coursePills .pill').forEach(p=>p.classList.toggle('active',p.dataset.ct===t));renderCourse()}
function renderCourse(){const el=$id('courseContent');if(courseTab==='plans')renderRunPlans(el);else if(courseTab==='vma')renderVmaCalc(el);else if(courseTab==='gps')renderGps(el);else if(courseTab==='history')renderRunHistory(el)}
function renderRunPlans(el){let html='<p style="color:var(--muted);font-size:13px;margin-bottom:12px">Choisis ton objectif.</p>';Object.entries(RUN_PLANS).forEach(([key,plan])=>{html+=`<div class="list-item" onclick="showRunPlan('${key}')" style="cursor:pointer"><div class="list-item-content"><div class="list-item-title">${plan.name}</div><div class="list-item-sub">${plan.weeks} semaines · ${plan.sessions.length} séances/sem</div></div><div style="font-size:18px;color:var(--red)">›</div></div>`});el.innerHTML=html}
function showRunPlan(key){const p=RUN_PLANS[key];if(!p)return;let html=`<div class="tags"><span class="tag">${p.weeks} semaines</span><span class="tag">${p.sessions.length} séances/sem</span></div>`;html+='<h3 style="margin-top:16px">Séances types</h3>';p.sessions.forEach(s=>{html+=`<div class="list-item"><div class="list-item-content"><div class="list-item-title">${s.day} · ${s.type}</div><div class="list-item-sub">${s.detail}</div></div></div>`});html+='<p style="color:var(--muted);font-size:12px;margin-top:12px">💡 Répète ces séances chaque semaine en augmentant progressivement.</p>';openModal(p.name,html)}
function renderVmaCalc(el){el.innerHTML=`<div class="card"><h3>Calculateur de VMA</h3><p style="color:var(--muted);font-size:13px;margin-bottom:12px">Test de Cooper : distance parcourue en 12 minutes.</p><div class="form-group"><label>Distance (mètres)</label><input type="number" id="vmaDist" placeholder="Ex: 2400"></div><button class="btn btn-primary btn-block" onclick="calcVMA()">Calculer</button></div><div id="vmaResult"></div>`}
function calcVMA(){const dist=parseFloat($id('vmaDist').value);if(!dist||dist<=0){alert('Entre une distance valide');return}const vma=(dist*5)/1000;let html=`<div class="card-hero"><div class="stat-label">Ta VMA estimée</div><div class="stat-big" style="color:var(--red)">${round(vma,1)} km/h</div></div>`;html+=`<div class="card"><h3>Allures d'entraînement</h3><div class="data-row"><span class="label">Endurance fondamentale (65%)</span><span class="value">${round(vma*0.65,1)} km/h</span></div><div class="data-row"><span class="label">Allure marathon (75%)</span><span class="value">${round(vma*0.75,1)} km/h</span></div><div class="data-row"><span class="label">Allure semi (80%)</span><span class="value">${round(vma*0.80,1)} km/h</span></div><div class="data-row"><span class="label">Allure 10K (85%)</span><span class="value">${round(vma*0.85,1)} km/h</span></div><div class="data-row"><span class="label">Allure 5K (90%)</span><span class="value">${round(vma*0.90,1)} km/h</span></div><div class="data-row"><span class="label">Fractionné court (100%)</span><span class="value">${round(vma,1)} km/h</span></div></div>`;$id('vmaResult').innerHTML=html}

/* ===== GPS ===== */
let gpsWatcher=null;
let gpsState={dist:0,startTime:null,points:[],running:false};
function renderGps(el){const isSecure=window.isSecureContext;const warning=!isSecure?'<div class="status err" style="background:rgba(217,71,61,.1);border-left:3px solid var(--red);padding:10px;border-radius:8px;font-size:12px;margin-bottom:12px">⚠️ GPS indisponible en HTTP. Utilise le lien ship.page (HTTPS) sur ton téléphone.</div>':'';el.innerHTML=`${warning}<div class="card"><h3>Suivi GPS</h3><p style="color:var(--muted);font-size:13px;margin-bottom:12px">Autorise la géolocalisation quand demandé.</p><div class="stat-card" style="margin-bottom:12px"><div class="stat-label">Distance</div><div class="stat-big" id="gpsDist" style="color:var(--red)">0.00 km</div></div><div class="grid grid-2" style="margin-bottom:12px"><div class="stat-card"><div class="stat-label">Durée</div><div style="font-size:20px;font-weight:900" id="gpsDur">0:00</div></div><div class="stat-card"><div class="stat-label">Allure</div><div style="font-size:20px;font-weight:900" id="gpsPace">—</div></div></div><button class="btn btn-primary btn-block" id="gpsBtn" onclick="toggleGps()">▶ Démarrer</button></div><div id="gpsRunResult"></div>`}
function toggleGps(){if(gpsState.running)stopGps();else startGps()}
function startGps(){if(!navigator.geolocation){alert('GPS non disponible sur ce navigateur');return}gpsState={dist:0,startTime:Date.now(),points:[],running:true};$id('gpsBtn').textContent='⏹ Arrêter';$id('gpsBtn').style.background='var(--red)';gpsWatcher=navigator.geolocation.watchPosition(pos=>{const{latitude,longitude}=pos.coords;gpsState.points.push({lat:latitude,lng:longitude,t:Date.now()});if(gpsState.points.length>1){const a=gpsState.points[gpsState.points.length-2];const b=gpsState.points[gpsState.points.length-1];gpsState.dist+=haversine(a.lat,a.lng,b.lat,b.lng)}updateGpsDisplay()},err=>{console.warn('GPS error',err)}, {enableHighAccuracy:true,maximumAge:1000,timeout:10000});gpsState.timer=setInterval(updateGpsDisplay,1000)}
function updateGpsDisplay(){const distKm=gpsState.dist;const elapsedSec=gpsState.startTime?(Date.now()-gpsState.startTime)/1000:0;const mins=Math.floor(elapsedSec/60);const secs=Math.floor(elapsedSec%60);const pace=distKm>0.01?(elapsedSec/60)/distKm:0;const paceMin=Math.floor(pace);const paceSec=Math.round((pace-paceMin)*60);const dEl=$id('gpsDist');if(dEl)dEl.textContent=distKm.toFixed(2)+' km';const durEl=$id('gpsDur');if(durEl)durEl.textContent=mins+':'+secs.toString().padStart(2,'0');const paceEl=$id('gpsPace');if(paceEl)paceEl.textContent=pace>0?paceMin+':'+paceSec.toString().padStart(2,'0'):'—'}
function stopGps(){if(gpsWatcher){navigator.geolocation.clearWatch(gpsWatcher);gpsWatcher=null}if(gpsState.timer)clearInterval(gpsState.timer);const elapsedSec=(Date.now()-gpsState.startTime)/1000;const mins=Math.round(elapsedSec/60);const distKm=gpsState.dist;const pace=distKm>0.01?(elapsedSec/60)/distKm:0;gpsState.running=false;$id('gpsBtn').textContent='▶ Démarrer';$id('gpsBtn').style.background='';if(distKm>0.05){const paceMin=Math.floor(pace);const paceSec=Math.round((pace-paceMin)*60);const run={date:today(),distance:round(distKm,2),duration:mins,pace:paceMin+':'+paceSec.toString().padStart(2,'0')+' /km'};state.runs.unshift(run);saveRuns();showToast('Course enregistrée ✓');renderDashboard();$id('gpsRunResult').innerHTML=`<div class="card-hero" style="margin-top:16px"><div class="stat-label">Course terminée</div><div style="font-size:20px;font-weight:900;margin-top:6px">${run.distance} km · ${run.duration} min</div><div style="color:var(--muted);font-size:13px">Allure : ${run.pace}</div></div>`}}
function haversine(lat1,lon1,lat2,lon2){const R=6371;const dLat=(lat2-lat1)*Math.PI/180;const dLon=(lon2-lon1)*Math.PI/180;const a=Math.sin(dLat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;return 2*R*Math.atan2(Math.sqrt(a),Math.sqrt(1-a))}
function renderRunHistory(el){if(state.runs.length===0){el.innerHTML='<div class="empty"><div class="ico">🏃</div><div class="empty-title">Aucune course enregistrée</div><div class="empty-text">Lance ton GPS pour commencer</div></div>';return}let html='';state.runs.slice(0,30).forEach(r=>{html+=`<div class="list-item"><div class="list-item-content"><div class="list-item-title">${r.distance} km · ${r.duration} min</div><div class="list-item-sub">${r.pace} · ${r.date}</div></div></div>`});el.innerHTML=html}

/* ===== NAV ===== */
function switchTab(tab){$$('.section').forEach(s=>s.classList.toggle('active',s.id==='tab-'+tab));$$('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));if(tab==='dashboard')renderDashboard();else if(tab==='muscu')renderMuscu();else if(tab==='nutrition')renderNutrition();else if(tab==='sommeil')renderSommeil();else if(tab==='course')renderCourse();window.scrollTo({top:0,behavior:'smooth'})}

/* ===== INIT ===== */
function init(){$$('.nav-btn').forEach(b=>b.addEventListener('click',()=>switchTab(b.dataset.tab)));$$('#muscuPills .pill').forEach(p=>p.addEventListener('click',()=>setMuscuTab(p.dataset.mt)));$$('#nutriPills .pill').forEach(p=>p.addEventListener('click',()=>setNutriTab(p.dataset.nt)));$$('#sommeilPills .pill').forEach(p=>p.addEventListener('click',()=>setSommeilTab(p.dataset.st)));$$('#coursePills .pill').forEach(p=>p.addEventListener('click',()=>setCourseTab(p.dataset.ct)));$id('modalOverlay').addEventListener('click',e=>{if(e.target===$id('modalOverlay'))closeModal()});renderDashboard();switchTab('dashboard')}

if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
</script>
</body>
</html>
